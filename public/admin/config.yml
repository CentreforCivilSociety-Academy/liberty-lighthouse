backend:
  name: github
  repo: CentreforCivilSociety-Academy/liberty-lighthouse
  branch: main
  base_url: https://liberty-lighthouse.vercel.app
  auth_endpoint: api/auth

local_backend: true

# How Decap turns a title into a filename, and so into a URL.
#
# Decap defaults to encoding: unicode, which keeps accented and non-Latin
# characters in the filename. Astro then rewrites them when it builds the
# route, so the file and the published URL disagree: two FAQs carried é and
# ï into their paths, and 17 share cards were generated at addresses no page
# asked for. Slugging to ASCII here keeps the filename, the URL and the card
# path identical.
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

media_folder: "public/images/content"
public_folder: "/images/content"

collections:
  # ─────────────────────────────────────────────
  # Site Settings (singleton files)
  # ─────────────────────────────────────────────
  - name: "settings"
    label: "Site Settings"
    description: "Customize the site's visual identity — fonts, colors, and layout. Changes take effect after the next site build."
    files:
      - label: "Share images"
        name: "share-images"
        file: "src/content/settings/share-images.json"
        description: "Optional overrides for the share cards on the main pages. Leave a field empty to use the card generated automatically. Make one at /tools/og, download the PNG, then upload it here."
        fields:
          - { label: "Home", name: "home", widget: "image", required: false, media_folder: "/public/images/og-uploads", public_folder: "/images/og-uploads" }
          - { label: "About", name: "about", widget: "image", required: false, media_folder: "/public/images/og-uploads", public_folder: "/images/og-uploads" }
          - { label: "Glossary", name: "glossary", widget: "image", required: false, media_folder: "/public/images/og-uploads", public_folder: "/images/og-uploads" }
          - { label: "Search", name: "search", widget: "image", required: false, media_folder: "/public/images/og-uploads", public_folder: "/images/og-uploads" }
          - { label: "AI and MCP", name: "ai", widget: "image", required: false, media_folder: "/public/images/og-uploads", public_folder: "/images/og-uploads" }
      # ── Typography & Fonts ──
      - name: "typography"
        label: "Typography & Fonts"
        file: "src/content/settings/typography.json"
        fields:
          - label: "Display Font (Headings)"
            name: "displayFont"
            widget: "select"
            options:
              - { label: "EB Garamond — the site's display face", value: "EB Garamond" }
            default: "Fraunces"
            hint: "The serif font used for all headings across the site — page titles like 'Education', section headings like 'Explore by Topic', and the hero title 'Liberty Lighthouse'. Default: Fraunces"

          - label: "Body Font"
            name: "bodyFont"
            widget: "select"
            options:
              - { label: "Roboto — the site's body face", value: "Roboto" }
            default: "Source Sans 3"
            hint: "The sans-serif font used for all body text — FAQ answers, video descriptions, navigation links, breadcrumbs, and buttons. Default: Source Sans 3"

          - label: "Monospace Font"
            name: "monoFont"
            widget: "select"
            options:
              - { label: "JetBrains Mono — the site's mono face", value: "JetBrains Mono" }
            default: "JetBrains Mono"
            hint: "The monospace font used for code blocks and technical content. Default: JetBrains Mono"

          - label: "Base Font Size (%)"
            name: "baseFontSize"
            widget: "number"
            value_type: "float"
            min: 93.75
            max: 118.75
            step: 6.25
            default: 106.25
            hint: "Controls the root font size that all other sizes scale from. 100% = 16px, 106.25% = 17px (default), 112.5% = 18px. Affects all body text, buttons, navigation, and metadata across every page."

          - label: "Base Line Height"
            name: "baseLineHeight"
            widget: "number"
            value_type: "float"
            min: 1.0
            max: 2.5
            step: 0.1
            default: 1.7
            hint: "Line spacing multiplier for body text — controls vertical rhythm in FAQ answers, video descriptions, and all paragraph content. Lower = tighter lines, higher = more breathing room. Default: 1.7"

          - label: "Hero Title Size (rem)"
            name: "heroTitleSize"
            widget: "number"
            value_type: "float"
            min: 2.0
            max: 6.0
            step: 0.25
            default: 3.5
            hint: "Font size for the main 'Liberty Lighthouse' hero title on the homepage. This is independent of other heading sizes. Uses responsive clamping (min 2rem, max this value). Default: 3.5rem"

          - label: "H1 Size (rem)"
            name: "h1Size"
            widget: "number"
            value_type: "float"
            min: 1.0
            max: 5.0
            step: 0.125
            default: 2.0
            hint: "Font size for main page headings — e.g., 'Education', 'Search', 'Topics', 'Page Not Found'. Measured in rem (relative to base font size). Default: 2rem"

          - label: "H2 Size (rem)"
            name: "h2Size"
            widget: "number"
            value_type: "float"
            min: 0.75
            max: 4.0
            step: 0.125
            default: 1.5
            hint: "Font size for section headings within pages — e.g., 'Explore by Topic', 'About Liberty Lighthouse', 'Frequently Asked Questions' cards. Default: 1.5rem"

          - label: "H3 Size (rem)"
            name: "h3Size"
            widget: "number"
            value_type: "float"
            min: 0.75
            max: 3.0
            step: 0.125
            default: 1.125
            hint: "Font size for smaller headings — e.g., individual video titles in the grid, FAQ question titles, sidebar headings, and card subheadings. Default: 1.125rem"

      # ── Colors & Theme ──
      - name: "colors"
        label: "Colors & Theme"
        file: "src/content/settings/colors.json"
        fields:
          - label: "Contrast"
            name: "contrastMode"
            widget: "select"
            default: "comfortable"
            options:
              - { label: "Comfortable — the standard palette", value: "comfortable" }
              - { label: "High contrast — darker text throughout, for harsh light or low vision", value: "high" }
            hint: "The only colour setting. Both options are checked against WCAG AA before they ship, so neither can make the site unreadable."
      - name: "content-guide"
        label: "Content Guide"
        file: "src/content/settings/content-guide.json"
        description: "A quick reference for writing and formatting content. Open this page whenever you need help."
        fields:
          - label: "Headings"
            name: "_headingsGuide"
            widget: "string"
            default: "Use Heading 2 for sections, Heading 3 for sub-sections. Never use Heading 1 — the page title already serves as the main heading."
            hint: "This is a reference — no need to edit."

          - label: "Images"
            name: "_imagesGuide"
            widget: "string"
            default: "Recommended width: 800–1200 px. Keep file size under 200 KB. Always add alt text when uploading."
            hint: "This is a reference — no need to edit."

          - label: "Tables"
            name: "_tablesGuide"
            widget: "text"
            default: "Don't upload images of tables. Instead, paste the table image into ChatGPT, Claude, or Gemini with this prompt:\n\n\"Convert this table image into a plain HTML table. Only output the <table> element with <thead>, <tbody>, <th>, and <td> tags. Do not include any CSS, classes, or styling attributes.\"\n\nThen switch to Markdown mode in the editor and paste the HTML."
            hint: "This is a reference — no need to edit."

          - label: "Links"
            name: "_linksGuide"
            widget: "string"
            default: "Select text, click the link button, and paste the URL. External links automatically open in a new tab."
            hint: "This is a reference — no need to edit."

          - label: "Workflow"
            name: "_workflowGuide"
            widget: "string"
            default: "Save as Draft to work privately. Set to 'In Review' when ready for feedback. Publish when finalised."
            hint: "This is a reference — no need to edit."

          - label: "YouTube Video ID"
            name: "_youtubeGuide"
            widget: "string"
            default: "Copy the 11-character code after 'v=' in the URL. Example: youtube.com/watch?v=dQw4w9WgXcQ → dQw4w9WgXcQ"
            hint: "This is a reference — no need to edit."

      # ── AI & Search Crawlers ──
      - name: "crawlers"
        label: "AI & Search Crawlers"
        file: "src/content/settings/crawlers.json"
        description: "These settings control which AI bots can read your site. There are two types: Training bots (they learn from your content to improve their AI models) and Search/Chat bots (they read your pages to answer user questions, with a link back to your site). Allowing all is recommended — it helps your content reach more people through AI tools."
        fields:
          - label: "── TRAINING BOTS ──"
            name: "_trainingLabel"
            widget: "hidden"
            default: ""
            hint: "These bots read your content to train AI models. Your pages become part of the AI's knowledge, which means future users who ask about Indian policy may get answers informed by your content — but without a direct link back."

          - label: "OpenAI — GPTBot"
            name: "gptBot"
            widget: "select"
            options:
              - { label: "✅ Allow (Recommended)", value: "allow" }
              - { label: "🚫 Block", value: "block" }
            default: "allow"
            hint: "Reads your content to train ChatGPT and other OpenAI models. If allowed, future ChatGPT answers about Indian policy may be informed by your content."

          - label: "Anthropic — ClaudeBot"
            name: "claudeBot"
            widget: "select"
            options:
              - { label: "✅ Allow (Recommended)", value: "allow" }
              - { label: "🚫 Block", value: "block" }
            default: "allow"
            hint: "Reads your content to train Claude (Anthropic's AI). If allowed, Claude's knowledge of Indian policy topics may improve thanks to your content."

          - label: "Google — Google-Extended"
            name: "googleExtended"
            widget: "select"
            options:
              - { label: "✅ Allow (Recommended)", value: "allow" }
              - { label: "🚫 Block", value: "block" }
            default: "allow"
            hint: "Reads your content for Google AI products like Gemini and AI Overviews. This is separate from regular Google Search — blocking this does NOT affect your Google search rankings."

          - label: "Common Crawl — CCBot"
            name: "ccBot"
            widget: "select"
            options:
              - { label: "✅ Allow (Recommended)", value: "allow" }
              - { label: "🚫 Block", value: "block" }
            default: "allow"
            hint: "Common Crawl is a non-profit that archives the open web. Many AI companies and academic researchers use this archive for training. Blocking removes your content from this public dataset."

          - label: "Apple — Applebot-Extended"
            name: "applebotExtended"
            widget: "select"
            options:
              - { label: "✅ Allow (Recommended)", value: "allow" }
              - { label: "🚫 Block", value: "block" }
            default: "allow"
            hint: "Reads your content for Apple Intelligence features (Siri, Safari suggestions). Blocking this does NOT affect regular Apple search or Safari browsing."

          - label: "── SEARCH & CHAT BOTS ──"
            name: "_searchLabel"
            widget: "hidden"
            default: ""
            hint: "These bots fetch your pages in real time when a user asks a question. Your content appears in the AI's answer WITH a link back to your site — this drives traffic."

          - label: "ChatGPT Search — OAI-SearchBot"
            name: "oaiSearchBot"
            widget: "select"
            options:
              - { label: "✅ Allow (Recommended)", value: "allow" }
              - { label: "🚫 Block", value: "block" }
            default: "allow"
            hint: "When someone asks ChatGPT a question, this bot fetches your page to include in the answer — with a link back to your site. Blocking means ChatGPT search results won't cite your content."

          - label: "Claude Search — Claude-SearchBot"
            name: "claudeSearchBot"
            widget: "select"
            options:
              - { label: "✅ Allow (Recommended)", value: "allow" }
              - { label: "🚫 Block", value: "block" }
            default: "allow"
            hint: "When someone asks Claude a question, this bot fetches your page to include in the answer — with a link back to your site. Blocking means Claude search results won't cite your content."

          - label: "ChatGPT Link Reader — ChatGPT-User"
            name: "chatgptUser"
            widget: "select"
            options:
              - { label: "✅ Allow (Recommended)", value: "allow" }
              - { label: "🚫 Block", value: "block" }
            default: "allow"
            hint: "When a ChatGPT user pastes a link to your site in their conversation, this bot reads the page so ChatGPT can discuss it. Blocking means users can't share your articles with ChatGPT."

          - label: "Claude Link Reader — Claude-User"
            name: "claudeUser"
            widget: "select"
            options:
              - { label: "✅ Allow (Recommended)", value: "allow" }
              - { label: "🚫 Block", value: "block" }
            default: "allow"
            hint: "When a Claude user pastes a link to your site, this bot reads the page so Claude can discuss it. Blocking means users can't share your articles with Claude."

          - label: "Perplexity Search — PerplexityBot"
            name: "perplexityBot"
            widget: "select"
            options:
              - { label: "✅ Allow (Recommended)", value: "allow" }
              - { label: "🚫 Block", value: "block" }
            default: "allow"
            hint: "Perplexity is an AI search engine that cites its sources. If allowed, your content may appear in Perplexity answers with a direct link back to your site."

  # ─────────────────────────────────────────────
  # Topics (admin-only — rarely edited)
  # ─────────────────────────────────────────────
  - name: "topics"
    label: "Topics"
    label_singular: "Topic"
    description: "Manage the main topic categories (e.g., Agriculture, Education). Most users won't need to edit this."
    folder: "src/content/topics"
    format: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Share image"
        name: "ogImage"
        widget: "image"
        required: false
        media_folder: "/public/images/og-uploads"
        public_folder: "/images/og-uploads"
        hint: "Optional. A card is generated automatically — only upload here to override it. Make one at /tools/og, download the PNG, then upload it. 1200x630."
      - label: "Topic Name"
        name: "title"
        widget: "string"
        hint: "e.g., Agriculture, Education, Healthcare"
      - label: "URL Slug"
        name: "slug"
        widget: "string"
        pattern: ['^[a-z0-9-]+$', "Use only lowercase letters, numbers, and hyphens"]
        hint: "This becomes part of the web address. Use lowercase, no spaces."
      - label: "Description"
        name: "description"
        widget: "text"
        hint: "A short summary of what this topic covers (1–2 sentences)."
      - label: "Icon"
        name: "icon"
        widget: "select"
        required: false
        options:
          - { label: "📖 Book Open (education, reading)", value: "book-open" }
          - { label: "🌱 Sprout (agriculture, growth)", value: "sprout" }
          - { label: "💓 Heart Pulse (healthcare)", value: "heart-pulse" }
          - { label: "🏛️ Landmark (governance, law)", value: "landmark" }
          - { label: "💵 Banknote (economics, finance)", value: "banknote" }
          - { label: "⚖️ Scale (justice, regulation)", value: "scale" }
          - { label: "🏭 Factory (industry, manufacturing)", value: "factory" }
          - { label: "🌍 Globe (foreign policy, trade)", value: "globe" }
          - { label: "🛡️ Shield (defense, security)", value: "shield" }
          - { label: "💧 Droplets (water, environment)", value: "droplets" }
          - { label: "⚡ Zap (energy, power)", value: "zap" }
          - { label: "🏗️ Building (infrastructure, urban)", value: "building" }
        hint: "Choose an icon that represents this topic. This icon may be used on topic cards in the future."
      - label: "Display Order"
        name: "order"
        widget: "number"
        value_type: "int"
        min: 1
        default: 1
        hint: "Lower numbers appear first on the homepage."
      - label: "Guided Syllabus"
        name: "guidedSyllabus"
        widget: "markdown"
        default: ""
        required: false
        editor_components: []
        hint: "Use Heading 2 for sections (not Heading 1). See the Content Guide in Site Settings for tips on images, tables, and formatting."

  # ─────────────────────────────────────────────
  # FAQs
  # ─────────────────────────────────────────────
  - name: "faqs"
    label: "FAQs"
    label_singular: "FAQ"
    description: "Frequently asked questions — each FAQ belongs to a topic and has a question + detailed answer. Content goes through a workflow: save as Draft to work privately, set to 'In Review' when ready for feedback, then publish when finalised."
    folder: "src/content/faqs"
    format: "frontmatter"
    extension: "mdx"
    create: true
    # Decap builds {{slug}} from the collection's identifier field, which
    # defaults to "title". This collection has no field by that name, so
    # Decap fell back to serialising the whole entry: 114 FAQs were created
    # at paths like map-order-1-draft-false-topic-gst-question-... and were
    # published at 250-character URLs. Naming the field fixes it.
    identifier_field: "question"
    slug: "{{slug}}"
    path: "{{topic}}/{{slug}}"
    fields:
      - label: "Share image"
        name: "ogImage"
        widget: "image"
        required: false
        media_folder: "/public/images/og-uploads"
        public_folder: "/images/og-uploads"
        hint: "Optional. A card is generated automatically — only upload here to override it. Make one at /tools/og, download the PNG, then upload it. 1200x630."
      - label: "Topic"
        name: "topic"
        widget: "relation"
        collection: "topics"
        search_fields: ["title"]
        value_field: "slug"
        display_fields: ["title"]
        hint: "Which topic does this FAQ belong to?"
      - label: "Question"
        name: "question"
        widget: "string"
        hint: "Type the full question exactly as it should appear on the site."
      - label: "Display Order"
        name: "order"
        widget: "number"
        value_type: "int"
        min: 1
        default: 1
        hint: "Controls the order FAQs appear in. Lower numbers show first."
      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false
        hint: "Turn this on to hide this FAQ from the public site while you work on it."
      - label: "Related FAQs"
        name: "relatedFAQs"
        widget: "relation"
        collection: "faqs"
        search_fields: ["question"]
        value_field: "{{topic}}/{{slug}}"
        display_fields: ["question"]
        multiple: true
        required: false
        hint: "Link to other FAQs that readers might find useful. Start typing a question to search."
      - label: "Related Videos"
        name: "relatedVideos"
        widget: "relation"
        collection: "videos"
        search_fields: ["title"]
        value_field: "{{topic}}/{{slug}}"
        display_fields: ["title"]
        multiple: true
        required: false
        hint: "Link to videos that cover the same topic. Start typing a video title to search."
      - label: "Answer"
        name: "body"
        widget: "markdown"
        hint: "Use Heading 2 for sections (not Heading 1 — the question is already the main heading). Every image needs a description: fill in the description field when you insert one, or put it inside the square brackets in Markdown. Without it the image is invisible to screen readers and to search engines. See the Content Guide in Site Settings."

  # ─────────────────────────────────────────────
  # Video Curriculum
  # ─────────────────────────────────────────────
  - name: "videos"
    label: "Videos"
    label_singular: "Video"
    description: "Video curriculum entries — each links to a YouTube video with notes. Content goes through a workflow: save as Draft to work privately, set to 'In Review' when ready for feedback, then publish when finalised."
    folder: "src/content/videos"
    format: "frontmatter"
    extension: "mdx"
    create: true
    slug: "{{slug}}"
    path: "{{topic}}/{{slug}}"
    fields:
      - label: "Share image"
        name: "ogImage"
        widget: "image"
        required: false
        media_folder: "/public/images/og-uploads"
        public_folder: "/images/og-uploads"
        hint: "Optional. A card is generated automatically — only upload here to override it. Make one at /tools/og, download the PNG, then upload it. 1200x630."
      - label: "Topic"
        name: "topic"
        widget: "relation"
        collection: "topics"
        search_fields: ["title"]
        value_field: "slug"
        display_fields: ["title"]
        hint: "Which topic does this video belong to?"
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "The title of the video as it should appear on the site."
      - label: "YouTube Video ID"
        name: "youtubeId"
        widget: "string"
        pattern: ['^[A-Za-z0-9_-]{11}$', "Must be exactly 11 characters (letters, numbers, hyphens, or underscores). Don't paste the full URL — just the code after 'v='."]
        hint: "The 11-character code from the YouTube URL. In youtube.com/watch?v=dQw4w9WgXcQ, the ID is dQw4w9WgXcQ. For Shorts like youtube.com/shorts/abc123DEFGH, the ID is abc123DEFGH. Don't paste the full URL — just the code."
      - label: "Format"
        name: "format"
        widget: "select"
        options:
          - { label: "Video", value: "video" }
          - { label: "Short", value: "short" }
        default: "video"
        hint: "Choose 'Short' for YouTube Shorts (vertical, brief clips). Choose 'Video' for regular YouTube videos."
      - label: "Orientation"
        name: "orientation"
        widget: "select"
        options:
          - { label: "Horizontal", value: "horizontal" }
          - { label: "Vertical", value: "vertical" }
        default: "horizontal"
        hint: "Only applies to Videos. Select 'Vertical' if the video is in portrait/vertical format. Shorts are always vertical."
      - label: "Short Description"
        name: "description"
        widget: "text"
        hint: "A brief summary of what the video covers (1–3 sentences)."
      - label: "Duration"
        name: "duration"
        widget: "string"
        required: false
        pattern: ['^\d{1,2}:\d{2}(:\d{2})?$', "Use MM:SS (e.g., 18:42) or H:MM:SS (e.g., 1:05:30) format."]
        hint: "How long is the video? Use MM:SS for videos under an hour (e.g., 18:42) or H:MM:SS for longer videos (e.g., 1:05:30)."
      - label: "Speaker"
        name: "speaker"
        widget: "string"
        required: false
        hint: "Who is speaking in this video? e.g., Dr. Parth Shah"
      - label: "Display Order"
        name: "order"
        widget: "number"
        value_type: "int"
        min: 1
        default: 1
        hint: "Controls the order videos appear in. Lower numbers show first."
      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false
        hint: "Turn this on to hide this video from the public site while you work on it."
      - label: "Related FAQs"
        name: "relatedFAQs"
        widget: "relation"
        collection: "faqs"
        search_fields: ["question"]
        value_field: "{{topic}}/{{slug}}"
        display_fields: ["question"]
        multiple: true
        required: false
        hint: "Link to FAQs that cover the same topic as this video. Start typing a question to search."
      - label: "Related Videos"
        name: "relatedVideos"
        widget: "relation"
        collection: "videos"
        search_fields: ["title"]
        value_field: "{{topic}}/{{slug}}"
        display_fields: ["title"]
        multiple: true
        required: false
        hint: "Link to other videos that viewers might enjoy. Start typing a title to search."
      - label: "Extended Notes"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Optional — add timestamps, key takeaways, or context. Use Heading 2 for sections (not Heading 1). See the Content Guide in Site Settings."

  # ─────────────────────────────────────────────
  # Glossary
  # ─────────────────────────────────────────────
  - name: "glossary"
    label: "Glossary"
    label_singular: "Term"
    description: "Glossary entries — each defines a term, its short definition (shown in hover popovers), and an optional long-form explanation. The filename becomes the URL slug. Wrap a phrase in <span data-no-gloss>...</span> in any article body to prevent it from being auto-linked there."
    folder: "src/content/glossary"
    format: "frontmatter"
    extension: "mdx"
    create: true
    # Same reason as faqs: no top-level "title" field here either. The
    # "title" at the bottom of this collection belongs to a nested widget.
    identifier_field: "term"
    slug: "{{slug}}"
    fields:
      - label: "Term"
        name: "term"
        widget: "string"
        hint: "The canonical name as it should appear on the site. e.g., MSP, voucher system, regulatory capture."
      - label: "Short definition"
        name: "definition"
        widget: "text"
        pattern: ['^.{1,280}$', "Keep the short definition under 280 characters."]
        hint: "One-line definition shown in the hover popover, the glossary index, and search results. Keep it under 280 characters."
      - label: "Aliases"
        name: "aliases"
        widget: "list"
        field: { label: "Alias", name: "alias", widget: "string" }
        required: false
        hint: "Other forms of the term that should also auto-link. e.g., for MSP add 'Minimum Support Price' and 'MSPs'. Each alias must be unique across all glossary entries."
      - label: "Related terms"
        name: "relatedTerms"
        widget: "relation"
        collection: "glossary"
        search_fields: ["term"]
        value_field: "{{slug}}"
        display_fields: ["term"]
        multiple: true
        required: false
        hint: "Other glossary terms readers might want to explore next. Shown as chips under 'Related terms' on the term page."
      - label: "Related FAQs"
        name: "relatedFAQs"
        widget: "relation"
        collection: "faqs"
        search_fields: ["question"]
        value_field: "{{topic}}/{{slug}}"
        display_fields: ["question"]
        multiple: true
        required: false
        hint: "Hand-curated FAQ links. The term page also auto-finds mentions across all FAQs."
      - label: "Related videos"
        name: "relatedVideos"
        widget: "relation"
        collection: "videos"
        search_fields: ["title"]
        value_field: "{{topic}}/{{slug}}"
        display_fields: ["title"]
        multiple: true
        required: false
        hint: "Hand-curated video links. The term page also auto-finds mentions across all videos."
      - label: "Recommended reading (citations)"
        name: "citations"
        widget: "list"
        required: false
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "URL", name: "url", widget: "string", pattern: ['^https?://', "Must start with http:// or https://"] }
          - { label: "Author", name: "author", widget: "string", required: false }
        hint: "Books, papers, or articles to cite on this term's page. Curated; not auto-discovered from the syllabus."
      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false
        hint: "Turn this on to hide this term from the public site while you work on it. Drafts are excluded from auto-linking."
      - label: "Long explanation"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Optional — full editorial explanation shown only on the term's own page. Leave blank if the short definition is enough; the page will still look complete."

  # ─────────────────────────────────────────────
  # Comments — Reader Submissions Awaiting Review
  # ─────────────────────────────────────────────
  - name: "comments"
    label: "Comments"
    label_singular: "Comment"
    description: |
      Reader comments submitted via the GitHub-login form on FAQ, video, and glossary pages. They arrive here as PENDING. Nothing is published to the site until you change a comment's status to APPROVED.

      About the three moderation choices:
      • APPROVE  — change status to "approved" and save. The site rebuilds within ~30 seconds and the comment goes live.
      • REJECT (KEEP)  — change status to "rejected" and save. The comment stays hidden from the site but the file remains in the repo as an audit trail. Use this for off-topic, low-quality, or obvious-but-non-abusive submissions.
      • DELETE  — use the trash icon (top-right of the editor). The file is removed from the repo entirely. Use this for abuse, harassment, doxxing, spam, or anything that shouldn't persist anywhere visible. Note: the original GitHub Issue at /issues/<number> may still contain the original submission body — for severe content, also delete that issue manually on GitHub.
    folder: "src/content/comments"
    extension: "md"
    format: "frontmatter"
    create: false
    delete: true
    sortable_fields: ["submitted_at", "status"]
    view_filters:
      - label: "Pending"
        field: "status"
        pattern: "pending"
      - label: "Approved"
        field: "status"
        pattern: "approved"
      - label: "Rejected"
        field: "status"
        pattern: "rejected"
    summary: "{{status | upper}} · {{name}} (@{{github_username}}) on {{page_type}}/{{page_id}}"
    fields:
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["pending", "approved", "rejected"]
        default: "pending"
        hint: "Set to 'approved' to publish. 'rejected' hides while keeping the file as audit trail. For abuse content, delete the entire entry instead (trash icon, top-right)."
      - label: "Page type"
        name: "page_type"
        widget: "select"
        options: ["faq", "video", "glossary"]
        hint: "Which kind of page this comment is attached to."
      - label: "Page ID"
        name: "page_id"
        widget: "string"
        hint: "Stable identifier for the page. e.g. 'agriculture/why-msp' for an FAQ, 'msp' for a glossary term. Don't edit unless you're moving a comment between pages."
      - label: "Display name"
        name: "name"
        widget: "string"
        hint: "Shown publicly above the comment."
      - label: "GitHub username"
        name: "github_username"
        widget: "string"
        hint: "Verified by the submission API at the time of posting; shown as @handle next to the comment. Don't edit."
      - label: "Body"
        name: "body"
        widget: "text"
        pattern: ['^[\s\S]{2,5000}$', "Must be 2–5000 characters."]
        hint: "The comment text. Plain text only — markdown is not rendered. Edit lightly if needed (typo fixes), or reject/delete instead of substantively rewriting."
      - label: "Submitted at"
        name: "submitted_at"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        hint: "When the comment was submitted (UTC)."
      - label: "Approved at"
        name: "approved_at"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        required: false
        hint: "Optional — set automatically by the workflow on first approval."
      - label: "Issue number"
        name: "issue_number"
        widget: "number"
        value_type: "int"
        required: false
        hint: "GitHub Issue number this comment was submitted from. Useful for tracing back to the original submission event."
      - label: "Parent comment ID"
        name: "parent_id"
        widget: "string"
        required: false
        hint: "Reserved for future threaded replies. Leave blank."
