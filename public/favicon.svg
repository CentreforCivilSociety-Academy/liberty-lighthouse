<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    A lit square throwing eight beams: a bulb, a lighthouse from above, and a
    silicon die with its leads. Flips to paper colour on dark browser chrome,
    since a favicon cannot inherit currentColor from the page.
  -->
  <style>
    :root { color: #1A1612; }
    @media (prefers-color-scheme: dark) { :root { color: #FDFBF9; } }
  </style>
  <rect x="9.5" y="9.5" width="5" height="5" fill="currentColor"/>
  <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
    <path d="M12 5.5V2M12 18.5V22M5.5 12H2M18.5 12H22"/>
    <path d="M7.4 7.4L4.9 4.9M16.6 16.6L19.1 19.1M16.6 7.4L19.1 4.9M7.4 16.6L4.9 19.1"/>
  </g>
</svg>
